name: vinyl-backoffice

services:
  postgres:
    image: postgres:16-alpine
    container_name: vinyl-backoffice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
